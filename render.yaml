# Render Blueprint — LifeGuard Readmission Backend
# Deploy: Render Dashboard → New → Blueprint → select this repo (it reads render.yaml)
# Spec reference: https://render.com/docs/blueprint-spec
#
# ⚠️ `sync: false` envVars must be filled in the Render dashboard AFTER first deploy
#    (Render will not launch until values are provided). Never commit real values here.

services:
  - type: web
    name: lifeguard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: oregon
    plan: starter          # free spins down; starter stays warm
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEPLOY_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: lifeguard-db
          property: connectionString
      - key: DEV_AUTH_TOKEN
        sync: false                      # set manually in Render dashboard
      - key: LOCAL_KEK
        sync: false                      # 64-char hex; generate: python -c "import secrets;print(secrets.token_hex(32))"
      - key: MODEL_ARTIFACT_PATH
        value: /app/ml/models/xgboost_v1
      - key: MIGRATE_ON_START
        value: "1"
      - key: ENABLE_HTTPS_REDIRECT
        value: "1"
      - key: ENABLE_TRUSTED_HOST
        value: "1"
      - key: ALLOWED_HOSTS
        value: lifeguard-backend.onrender.com
      - key: CORS_ORIGINS
        sync: false                      # set to your Vercel URL, e.g. https://lifeguard-frontend.vercel.app
    disk:
      name: model-artifacts
      mountPath: /app/ml
      sizeGB: 1                          # cheapest persistent disk; holds models only

databases:
  - name: lifeguard-db
    databaseName: lifeguard
    user: lifeguard
    plan: free
    postgresMajorVersion: "15"
