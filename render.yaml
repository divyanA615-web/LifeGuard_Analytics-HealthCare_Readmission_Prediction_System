# Render Blueprint — LifeGuard Analytics (Production-Ready)
# Deployment: Render Dashboard → New Blueprint from GitHub repo → read this file.
# Spec: https://render.com/docs/blueprint-speccsss

services:
  - type: web
    name: lifeguard-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: us-east1 # cheapest performance
    plan: starter # persistent & affordable
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEPLOY_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: lifeguard-db
          property: connectionString
      - key: MODEL_ARTIFACT_PATH
        value: /app/ml/models/xgboost_v1
      - key: MIGRATE_ON_START
        value: "1"
      - key: DEV_AUTH_TOKEN
        sync: false
      - key: LOCAL_KEK
        sync: false
      - key: CORS_ORIGINS
        sync: false # Set in Render dashboard: https://your-vercel-app.vercel.app

databases:
  - name: lifeguard-db
    databaseName: lifeguard
    user: lifeguard
    plan: free
    postgresMajorVersion: "15"
