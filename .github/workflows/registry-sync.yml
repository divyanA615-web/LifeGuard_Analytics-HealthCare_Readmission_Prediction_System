name: registry-sync

on:
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/registry-sync.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/lifeguard-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/lifeguard-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image attestation summary
        run: |
          echo "## Registry sync report" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend image | ${{ env.IMAGE_BACKEND }}:${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend image | ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Builder | GitHub Actions runner |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Validate immutability (checksum)
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker buildx imagetools inspect ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
