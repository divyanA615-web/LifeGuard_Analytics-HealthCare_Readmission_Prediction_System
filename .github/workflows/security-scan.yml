name: Security Scans

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  container-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -t lifeguard-api-scan backend
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lifeguard-api-scan:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  iac-scan:
    name: tfsec + checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.3115.0
        with:
          directory: infra
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif

  python-bandit:
    name: Python Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install -r requirements.txt bandit
      - run: bandit -r app -ll
