name: Security Scans

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-bandit:
    name: Python Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt bandit
      - run: bandit -r app -ll

  frontend-eslint:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run scan -- --max-warnings=0 || true

  image-audit:
    if: github.ref == 'refs/heads/main'
    name: Container CVE Scan (CI — Deploy Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build backend image locally for scanning
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: lifeguard-backend:latest

      # Scan the locally built image
      - name: Scan backend image
        shell: bash
        run: |
          echo "Run Trivy via docker run because OS no longer embraces trivy CLI directly on ubuntu agents."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             --entrypoint "" aquasec/trivy:latest             image --severity HIGH,CRITICAL --format sarif --output trivy-report.sarif lifeguard-backend:latest
        working-directory: ${{ github.workspace }}

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-report.sarif

  terraform-scan:
    needs: backend-bandit
    name: Terraform IaC (Basic Verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Terraform Format Check Only
        uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive || exit 1
