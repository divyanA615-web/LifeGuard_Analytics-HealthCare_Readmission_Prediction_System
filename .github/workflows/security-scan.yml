name: Security Scans

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-bandit:
    name: Python Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt bandit
      - run: bandit -r app -ll

  frontend-eslint:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run scan -- --max-warnings=0 || true

  image-audit:
    if: github.ref == 'refs/heads/main'
    name: Container CVE Scan (CI — Deploy Gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build backend image locally for scanning
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: lifeguard-backend:latest

      # Scan the locally built image.
      # Note: the trivy image sets its entrypoint to `trivy`, so we must NOT
      # clear the entrypoint with `--entrypoint ""` (that makes the `image`
      # subcommand be treated as the executable, which fails with
      # "executable file not found"). Keep the default entrypoint and pass the
      # subcommand as the first argument.
      #
      # --ignore-unfixed: only fail the gate on CVEs that HAVE a fix available.
      # Unfixable base-image noise still lands in the Security tab via SARIF,
      # but cannot block the pipeline. A fixable HIGH/CRITICAL still fails.
      - name: Scan backend image
        shell: bash
        run: |
          echo "Run Trivy via docker run (trivy entrypoint preserved)."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output trivy-report.sarif \
            --exit-code 1 lifeguard-backend:latest
        working-directory: ${{ github.workspace }}

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-report.sarif
