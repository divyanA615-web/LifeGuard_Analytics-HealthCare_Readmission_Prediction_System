# Dependabot
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ml-deps:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      workflow-deps:
        patterns: ["*"]
